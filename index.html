<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navigation */
header{
    background:#ff5722;
    color:white;
    padding:15px 50px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}

nav ul li a:hover{
    color:yellow;
}

/* Hero Section */
.hero{
    height:60vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:50px;
    margin-bottom:15px;
}

.hero p{
    font-size:20px;
    margin-bottom:20px;
}

.hero button{
    padding:12px 25px;
    border:none;
    background:#ff9800;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

.hero button:hover{
    background:#e68900;
}

/* Menu */
.menu{
    padding:50px;
    text-align:center;
}

.menu h2{
    margin-bottom:30px;
    color:#333;
}

.food-container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.food-card{
    width:250px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.food-card:hover{
    transform:translateY(-8px);
}

.food-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.food-card h3{
    margin:15px 0 10px;
}

.food-card p{
    color:#ff5722;
    font-size:20px;
    margin-bottom:15px;
}

.food-card button{
    margin-bottom:20px;
    padding:10px 20px;
    border:none;
    background:#ff5722;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.food-card button:hover{
    background:#e64a19;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* Responsive */
@media(max-width:768px){
    nav{
        flex-direction:column;
    }

    nav ul{
        margin-top:10px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:18px;
    }
}
</style>

</head>
<body>

<header>
    <nav>
        <h2>🍔 FoodExpress</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Offers</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>Delicious Food Delivered Fast</h1>
        <p>Order your favorite meals anytime, anywhere.</p>
        <button>Order Now</button>
    </div>
</section>

<section class="menu">
    <h2>Popular Dishes</h2>

    <div class="food-container">

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" alt="Burger">
            <h3>Cheese Burger</h3>
            <p>₹250</p>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591" alt="Pizza">
            <h3>Veg Pizza</h3>
            <p>₹450</p>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9" alt="Pasta">
            <h3>White Sauce Pasta</h3>
            <p>₹350</p>
            <button>Add to Cart</button>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877" alt="Fries">
            <h3>French Fries</h3>
            <p>₹250</p>
            <button>Add to Cart</button>
        </div>

    </div>
</section>

<footer>
    <p>© 2026 FoodExpress | Delicious Food Delivered to Your Doorstep</p>
</footer>

</body>
</html>
